<section id="contact" class="section contact">
  <div class="container">
    <div class="contact__panel card" appReveal>
      <span class="section-tag">04 · Contact</span>
      <h2 class="contact__title">Have a hard problem? <em class="display-accent">Let's talk.</em></h2>
      <p class="contact__lead">
        Hiring for a forward-deployed or full-stack role, or just want to compare notes on
        broker APIs? My inbox is always open.
      </p>

      <div class="contact__actions">
        <a class="btn btn-primary contact__email" [href]="'mailto:' + site.email">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="m3 6.5 9 6 9-6"/></svg>
          {{ site.email }}
        </a>
      </div>

      <div class="contact__socials">
        <a [href]="site.linkedin" target="_blank" rel="noopener" aria-label="LinkedIn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.45-2.14 2.94v5.66H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45Z"/></svg>
          <span>LinkedIn</span>
        </a>
        <a [href]="site.x" target="_blank" rel="noopener" aria-label="X (Twitter)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.66l-5.21-6.82-5.97 6.82H1.67l7.73-8.84L1.25 2.25h6.83l4.71 6.23 5.45-6.23Zm-1.16 17.52h1.83L7.08 4.13H5.12l11.96 15.64Z"/></svg>
          <span>X</span>
        </a>
        <a [href]="site.instagram" target="_blank" rel="noopener" aria-label="Instagram">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/></svg>
          <span>Instagram</span>
        </a>
      </div>
    </div>
  </div>
</section>
